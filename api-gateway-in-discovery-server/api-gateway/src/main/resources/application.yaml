spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: demo-service-route
          uri: lb://demo-service
          predicates:
            - Path=/demo-service/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/]':
            allowed-origins:
              - "*"
            allowed-headers:
              - "*"
            allowed-methods:
              - "*"
server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9090/eureka